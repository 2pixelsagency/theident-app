<!-- Paste into Supabase → Authentication → Emails → Reset password (subject: "Reset your password · The Ident").
     The link uses token_hash so it works in any browser/app (not only the one that asked for it). -->
<div style="background:#F6F4EE;padding:28px 12px;font-family:Inter,Helvetica,Arial,sans-serif;color:#15211C;">
  <div style="max-width:520px;margin:0 auto;background:#ffffff;border-radius:22px;overflow:hidden;">
    <div style="background:#123127;padding:22px 28px;">
      <span style="font-family:'Bricolage Grotesque',Helvetica,Arial,sans-serif;font-weight:700;letter-spacing:-0.03em;font-size:20px;color:#CBF24C;">The Ident</span>
    </div>
    <div style="padding:30px 28px 22px;">
      <h1 style="margin:0 0 12px;font-family:'Bricolage Grotesque',Helvetica,Arial,sans-serif;font-weight:700;letter-spacing:-0.03em;font-size:27px;line-height:1.12;">Reset your password</h1>
      <p style="margin:0 0 14px;font-size:15px;line-height:1.6;color:#5C6862;">We got a request to reset the password for your The Ident account. Tap below to choose a new one — the link works for one hour.</p>
      <a href="{{ .SiteURL }}/reset-password?token_hash={{ .TokenHash }}&type=recovery" style="display:inline-block;margin:6px 0 10px;background:#CBF24C;color:#15211C;text-decoration:none;padding:14px 28px;border-radius:14px;font-weight:700;font-size:15px;">Choose a new password</a>
      <p style="margin:14px 0 0;font-size:13px;line-height:1.5;color:#5C6862;">Didn’t ask for this? You can ignore this email — your password won’t change.</p>
    </div>
    <div style="padding:18px 28px 26px;border-top:1px solid #ECE9E1;">
      <p style="margin:0;font-size:12px;line-height:1.5;color:#5C6862;">Questions? Email <a href="mailto:hello@theident.me" style="color:#123127;">hello@theident.me</a>.</p>
    </div>
  </div>
</div>
